name: release

# Builds Tauri installers and attaches them to a GitHub Release.
# Trigger: a release is published from github.com (Releases → Draft a new
# release → Publish).
#
# Only plain semver tags like v0.1.0 are supported — pre-release tags such
# as v0.1.0-rc.1 are rejected, because the Windows MSI bundler does not
# accept non-numeric pre-release identifiers and stripping them would make
# multiple rc builds collide on the same installer version.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate tag is plain semver
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a plain semver tag (vMAJOR.MINOR.PATCH). Pre-release tags are not supported."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # release events check out the default branch by default; we want
          # the exact tag that was published.
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "Syncing version $VERSION into tauri.conf.json and Cargo.toml"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          python3 - <<'PY'
          import os, re
          v = os.environ['VERSION']
          path = 'src-tauri/Cargo.toml'
          with open(path) as f:
              src = f.read()
          src = re.sub(r'(?m)^version = "[^"]*"', f'version = "{v}"', src, count=1)
          with open(path, 'w') as f:
              f.write(src)
          PY
        env:
          VERSION: ${{ github.event.release.tag_name }}

      - name: Build web frontend
        run: pnpm --filter @aoe4-almanac/web build

      - name: Build Tauri app and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }}
