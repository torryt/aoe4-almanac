name: release

# Builds Tauri installers and attaches them to a GitHub Release.
# Trigger: a release is published from github.com (Releases → Draft a new
# release → Publish).
#
# Only plain semver tags like 0.1.0 (optionally v-prefixed) are supported —
# pre-release tags such as 0.1.0-rc.1 are rejected, because the Windows
# bundler does not accept non-numeric pre-release identifiers and stripping
# them would make multiple rc builds collide on the same installer version.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate tag is plain semver
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a plain semver tag (MAJOR.MINOR.PATCH, optionally v-prefixed). Pre-release tags are not supported."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          export VERSION
          echo "Syncing version $VERSION into tauri.conf.json and Cargo.toml"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          python3 - <<'PY'
          import os, re
          v = os.environ['VERSION']
          path = 'src-tauri/Cargo.toml'
          with open(path) as f:
              src = f.read()
          src = re.sub(r'(?m)^version = "[^"]*"', f'version = "{v}"', src, count=1)
          with open(path, 'w') as f:
              f.write(src)
          PY

      - name: Build web frontend
        run: pnpm --filter @aoe4-almanac/web build

      - name: Build Tauri app and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  # After all platform builds finish, fetch the per-platform .sig files from
  # the release and assemble a single latest.json that the updater endpoint
  # serves. tauri-action emits one latest.json per matrix job, which would
  # otherwise clobber each other; this job replaces them with a merged one.
  publish-updater-manifest:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Assemble latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          mkdir -p _updater
          cd _updater

          # Download all .sig files plus the platform installers we point to.
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' || true
          ls -la

          base_url="https://github.com/${REPO}/releases/download/${TAG}"

          # Resolve asset names from the release.
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          appimage=$(echo "$assets" | grep -E '\.AppImage$' | head -n1 || true)
          appimage_sig=$(echo "$assets" | grep -E '\.AppImage\.sig$' | head -n1 || true)
          nsis=$(echo "$assets" | grep -E '-setup\.exe$' | head -n1 || true)
          nsis_sig=$(echo "$assets" | grep -E '-setup\.exe\.sig$' | head -n1 || true)
          macapp=$(echo "$assets" | grep -E '\.app\.tar\.gz$' | head -n1 || true)
          macapp_sig=$(echo "$assets" | grep -E '\.app\.tar\.gz\.sig$' | head -n1 || true)

          read_sig() {
            local f="$1"
            [[ -z "$f" || ! -f "$f" ]] && echo "" || cat "$f"
          }

          linux_sig=$(read_sig "$appimage_sig")
          win_sig=$(read_sig "$nsis_sig")
          mac_sig=$(read_sig "$macapp_sig")

          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "${RELEASE_BODY:-}" \
            --arg pub_date "$pub_date" \
            --arg linux_url "${base_url}/${appimage}" \
            --arg linux_sig "$linux_sig" \
            --arg win_url "${base_url}/${nsis}" \
            --arg win_sig "$win_sig" \
            --arg mac_url "${base_url}/${macapp}" \
            --arg mac_sig "$mac_sig" '
            {
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: (
                {} +
                (if $linux_sig != "" then {"linux-x86_64": {signature: $linux_sig, url: $linux_url}} else {} end) +
                (if $win_sig != "" then {"windows-x86_64": {signature: $win_sig, url: $win_url}} else {} end) +
                (if $mac_sig != "" then {"darwin-aarch64": {signature: $mac_sig, url: $mac_url}} else {} end)
              )
            }' > latest.json

          cat latest.json

          # Replace any per-platform latest.json that tauri-action uploaded.
          gh release delete-asset "$TAG" latest.json --repo "$REPO" --yes || true
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
